version: "3.9"

services:
  server1:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
      ZK_URL: zookeeper:2181
    depends_on:
      - redis
      - zookeeper
    restart: unless-stopped

  server2:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
      ZK_URL: zookeeper:2181
    depends_on:
      - redis
      - zookeeper
    restart: unless-stopped

  server3:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
      ZK_URL: zookeeper:2181
    depends_on:
      - redis
      - zookeeper
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost/api/url
    depends_on:
      - nginx
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  zookeeper:
    image: zookeeper:3.9
    restart: unless-stopped