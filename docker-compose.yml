version: "3.9"

services:
  # Backend instances (3 replicas for load balancing)
  server1:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
      ZK_URL: zookeeper:2181
    depends_on:
      - redis
      - zookeeper
    restart: unless-stopped

  server2:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
      ZK_URL: zookeeper:2181
    depends_on:
      - redis
      - zookeeper
    restart: unless-stopped

  server3:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
      ZK_URL: zookeeper:2181
    depends_on:
      - redis
      - zookeeper
    restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Zookeeper
  zookeeper:
    image: zookeeper:3.9
    restart: unless-stopped